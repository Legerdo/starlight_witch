<!DOCTYPE html>

<body>
<canvas id="screen" role="img" aria-label="밤하늘 아래 폐허에서 별빛 마법을 시전하는 분홍 트윈테일 마녀 소녀의 픽셀 아트 애니메이션"></canvas>
<script>
'use strict';
(() => {
// =====================================================================
//  CONSTANTS
// =====================================================================
const W = 128, H = 96;          // logical resolution (never changes)
const L = 360;                  // loop length in 60Hz ticks (6 s)
const Q = 5;                    // sprite pose quantization: 60/5 = 12 fps
const TAU = Math.PI * 2;
const CX = 30, GY = 83;         // witch root (between the feet) in world px
const IX = 100, IY = 60;        // spell impact point (pillar face)
const HS0 = 220, HS1 = 228;     // hit-stop window (ticks)
const MG = 2;                   // static layer margin for screen shake
const RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// =====================================================================
//  PALETTE — 26 fixed colors
// =====================================================================
const HEX = [
  '#0b0a1f', '#16163a', '#262659',             //  0- 2 night sky deep / mid / horizon
  '#2b2945', '#433f66', '#66608c',             //  3- 5 stone dark / mid / light
  '#120b1c',                                   //  6    outline
  '#4d1c4a', '#9a3a78', '#e0709f', '#ffb4d2',  //  7-10 hair outline / dark / base / highlight
  '#e0968a', '#fcd9c0',                        // 11-12 skin shadow / skin
  '#262c68', '#3c4aa6', '#6f86e0',             // 13-15 cloth shadow / base / highlight
  '#a19ec8', '#eeecf8',                        // 16-17 white cloth shadow / base
  '#b5732a', '#ffd56a',                        // 18-19 gold dark / gold
  '#d0344f',                                   // 20    ribbon red
  '#1c3f86', '#2d86d8', '#52dcf4', '#b8f7ff',  // 21-24 magic: dissipating → mid → saturated → pale
  '#ffffff'                                    // 25    white-hot impact
];
const BG0 = 0, BG1 = 1, BG2 = 2, ST0 = 3, ST1 = 4, ST2 = 5, OUT = 6,
      HO = 7, HD = 8, HB = 9, HL = 10, SS = 11, SK = 12,
      CS = 13, CB = 14, CH = 15, WS = 16, WH = 17, GD = 18, GL = 19, RD = 20,
      M0 = 21, M1 = 22, M2 = 23, M3 = 24, HOT = 25;

const LITTLE = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
const PAL = new Uint32Array(HEX.length);
for (let i = 0; i < HEX.length; i++) {
  const v = parseInt(HEX[i].slice(1), 16), r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
  PAL[i] = LITTLE ? ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0 : ((r << 24) | (g << 16) | (b << 8) | 255) >>> 0;
}

// color remap tables
function lut(pairs) {
  const a = new Uint8Array(32);
  for (let i = 0; i < 32; i++) a[i] = i;
  for (let i = 0; i < pairs.length; i += 2) a[pairs[i]] = pairs[i + 1];
  return a;
}
const OUTL = new Uint8Array(32).fill(OUT);               // selective outline per material
OUTL[HD] = OUTL[HB] = OUTL[HL] = OUTL[SS] = OUTL[SK] = HO;
OUTL[M1] = OUTL[M2] = OUTL[M3] = OUTL[HOT] = M0;
const RIMS = lut([HD, M3, HB, M3, HL, M3, SS, M3, SK, M3, CS, M2, CB, M2, CH, M3, WS, HOT, WH, HOT, GD, GL, GL, HOT, RD, M3]);
const RIMW = lut([HD, HB, HB, HL, HL, WH, SS, SK, SK, WH, CS, CB, CB, CH, CH, M2, WS, WH, GD, GL, RD, HL]);
const LIT1 = lut([ST0, ST1, ST1, ST2, ST2, WS]);
const LIT2 = lut([ST0, M0, ST1, M1, ST2, M2, WS, M3, BG0, ST0]);
const DARK = lut([ST1, ST0, ST2, ST1, ST0, BG1, WS, ST2]);
const TINT = lut([BG0, BG1, BG1, BG2, BG2, M0, ST0, ST1, ST1, ST2, ST2, WS]);
const BOOTD = lut([WH, WS, CB, CS, CH, CB]);

const BAY = new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]);
for (let i = 0; i < 16; i++) BAY[i] = (BAY[i] + 0.5) / 16;
const bay = (x, y) => BAY[((y & 3) << 2) | (x & 3)];

// deterministic RNG (mulberry32)
let rs = 1;
function rnd() {
  rs = (rs + 0x6D2B79F5) | 0;
  let t = Math.imul(rs ^ (rs >>> 15), 1 | rs);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const RUN_SEED = 0x51A7;

// =====================================================================
//  BUFFERS
// =====================================================================
const buf = new Uint8Array(W * H);        // final indexed frame
const cb = new Uint8Array(W * H);         // character layer (0 = empty)
const cf = new Uint8Array(W * H);         // char flags: 1 outline, 2 no-rim, 4 rimmed
const pb = new Uint8Array(W * H);         // scratch for one sprite part
const BW = W + MG * 2, BH = H + MG * 2;
const bgS = new Uint8Array(BW * BH);      // static background (with shake margin)
const fgS = new Uint8Array(BW * BH);      // static foreground silhouettes (0 = clear)
let camX = 0, camY = 0;
let pbx0 = W, pby0 = H, pbx1 = -1, pby1 = -1;

const R = Math.round;
function px(x, y, c) {                    // world pixel → frame (with camera)
  x = R(x) + camX; y = R(y) + camY;
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  buf[y * W + x] = c;
}
function pp(x, y, c) {                    // world pixel → part scratch
  x = R(x); y = R(y);
  if (x < 1 || y < 1 || x >= W - 1 || y >= H - 1) return;
  pb[y * W + x] = c;
  if (x < pbx0) pbx0 = x; if (x > pbx1) pbx1 = x;
  if (y < pby0) pby0 = y; if (y > pby1) pby1 = y;
}
function bs(x, y, c) { if (x < -MG || y < -MG || x >= W + MG || y >= H + MG) return; bgS[(y + MG) * BW + x + MG] = c; }
function fs(x, y, c) { if (x < -MG || y < -MG || x >= W + MG || y >= H + MG) return; fgS[(y + MG) * BW + x + MG] = c; }

// =====================================================================
//  HAND-PIXELED TEMPLATES
// =====================================================================
const CM = { '.': 0, H: HB, L: HL, D: HD, O: HO, S: SK, s: SS, E: OUT, I: M1, W: WH, w: WS,
             p: HL, B: CB, b: CS, h: CH, R: RD, G: GL, g: GD };
function tpl(rows) {
  const h = rows.length, w = rows[0].length, d = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) d[y * w + x] = CM[rows[y][x]] || 0;
  return { w, h, d };
}
function stamp(t, x0, y0, map) {
  for (let y = 0; y < t.h; y++) for (let x = 0; x < t.w; x++) {
    const c = t.d[y * t.w + x];
    if (c) pp(x0 + x, y0 + y, map ? map[c] : c);
  }
}
const HEAD = tpl([            // 3/4 view facing right; hat covers rows 0-2
  '...HHHHHH...',
  '.HHHHHHHHHH.',
  'HHHHHHHHHHHH',
  'HHHLLLHHHHHH',
  'HHLLHHHHHDHH',
  'DHHHHHDHHDHH',
  'DHHHDHSHHSHS',
  'DHHHDSEEHSES',
  'DHHHDSIWSSIS',
  'DHHDDSIISSIS',
  'DDHDDspSSsS.',
  '.DD...sSSs..'
]);
const TORSO = tpl([
  '.wWWWWWw.',
  'wWWWRGRWw',
  '.bBBRBRh.',
  '.bBBBBBh.',
  '..bBBBh..',
  '..gGGGg..'
]);
const BOOT = tpl([
  'wWW..',
  'bBBB.',
  'bBBBh',
  'bbbbb'
]);
const BOW = tpl([
  'RR.RR',
  'RRGRR',
  'RR.RR',
  '.R.R.'
]);
const RING = tpl([
  '..gGG..',
  '.g...G.',
  'g.....G',
  'g.....G',
  'g.....G',
  '.g...g.',
  '..ggg..'
]);

// clean pixel-art line slopes for the staff (0, 1:3, 1:2, 1:1, 2:1, 3:1, 90°)
const DIRS = (() => {
  const base = [[1, 0], [3, 1], [2, 1], [1, 1], [1, 2], [1, 3], [0, 1]], out = [], seen = {};
  for (const sx of [1, -1]) for (const sy of [1, -1]) for (const b of base) {
    const x = b[0] * sx, y = b[1] * sy, k = x + ',' + y;
    if (seen[k]) continue; seen[k] = 1;
    const l = Math.hypot(x, y); out.push(x / l, y / l);
  }
  return new Float32Array(out);
})();
const ND = DIRS.length / 2;

// =====================================================================
//  ANIMATION TRACKS  [tick, value, easeIntoThisKey, ...]
// =====================================================================
const LIN = 0, IQ = 1, OQ = 2, IO = 3, OC = 4, ST = 5;
function ease(e, u) {
  switch (e) {
    case IQ: return u * u;
    case OQ: return 1 - (1 - u) * (1 - u);
    case IO: return 0.5 - 0.5 * Math.cos(Math.PI * u);
    case OC: { const v = 1 - u; return 1 - v * v * v; }
    case ST: return 0;
  }
  return u;
}
function tr(k, t) {
  const n = k.length;
  if (t <= k[0]) return k[1];
  for (let i = 3; i < n; i += 3) {
    if (t < k[i]) {
      const t0 = k[i - 3], v0 = k[i - 2];
      return v0 + (k[i + 1] - v0) * ease(k[i + 2], (t - t0) / (k[i] - t0));
    }
  }
  return k[n - 2];
}
const F = a => new Float32Array(a);
//  0-120 idle | 120-150 anticipation | 150-212 charge | 212-220 strike | 220-228 flash+hit-stop
//  228-240 projectile | 240+ impact | 228-300 recover | 300-360 idle
const K = {
  bx:   F([0,0,0, 120,0,0, 142,-1,IO, 205,-1,0, 212,-2,IO, 220,2,OC, 228,2,0, 262,1,IO, 292,0,IO, 360,0,0]),
  by:   F([0,0,0, 120,0,0, 142,2,IO, 150,2,0, 170,-1,OQ, 185,0,IO, 205,0,0, 212,1,IO, 228,1,0, 255,0,IO, 360,0,0]),
  bw:   F([0,1,0, 112,1,0, 122,0,LIN, 290,0,0, 305,1,LIN, 360,1,0]),
  hdx:  F([0,0,0, 219,0,0, 220,1,ST, 240,1,0, 262,0,IO, 360,0,0]),
  hdy:  F([0,0,0, 128,0,0, 140,1,IO, 158,1,0, 168,-1,OQ, 182,0,IO, 219,0,0, 220,1,ST, 228,1,0, 234,0,IO, 360,0,0]),
  eye:  F([0,0,0, 60,2,ST, 65,1,ST, 70,0,ST, 126,2,ST, 196,3,ST, 238,0,ST, 272,4,ST, 296,0,ST, 330,2,ST, 335,1,ST, 340,0,ST, 360,0,0]),
  mouth:F([0,0,0, 126,1,ST, 212,2,ST, 238,0,ST, 272,3,ST, 296,0,ST, 360,0,0]),
  ang:  F([0,-63.4,0, 120,-63.4,0, 142,-45,IO, 150,-45,0, 172,-71.6,OQ, 205,-71.6,0, 212,-108,IO, 220,-18.4,OC, 228,-18.4,0, 252,-45,OQ, 275,-74,IO, 295,-63.4,IO, 360,-63.4,0]),
  fhx:  F([0,5,0, 120,5,0, 142,4,IO, 150,4,0, 172,7,OQ, 205,7,0, 212,6,IO, 220,8,OC, 228,8,0, 252,7,OQ, 280,5,IO, 360,5,0]),
  fhy:  F([0,-11,0, 120,-11,0, 142,-10,IO, 150,-10,0, 172,-24,OQ, 205,-24,0, 212,-25,IO, 220,-17,OC, 228,-17,0, 252,-13,OQ, 280,-11,IO, 360,-11,0]),
  bhx:  F([0,3,0, 120,3,0, 142,5,IO, 172,10,OQ, 205,10,0, 212,7,IO, 220,-6,OC, 228,-6,0, 262,0,IO, 290,3,IO, 360,3,0]),
  bhy:  F([0,-11,0, 120,-11,0, 142,-15,IO, 172,-19,OQ, 205,-19,0, 212,-18,IO, 220,-15,OC, 228,-15,0, 262,-12,IO, 290,-11,IO, 360,-11,0]),
  ffx:  F([0,0,0, 219,0,0, 220,2,ST, 264,2,0, 265,0,ST, 360,0,0]),
  tail: F([0,0,0, 125,0,0, 145,-1.5,IO, 162,0.5,IO, 180,0,IO, 205,0,0, 212,-1,IO, 228,-1,0, 233,4.5,OC, 240,5,LIN, 256,-1.5,IO, 272,0.8,IO, 292,0,IO, 360,0,0]),
  cape: F([0,0,0, 128,0,0, 150,-1.5,IO, 168,0.5,IO, 185,0,IO, 205,0,0, 212,-1,IO, 228,-1,0, 236,4,OC, 246,4.5,LIN, 264,-1.2,IO, 282,0.5,IO, 305,0,IO, 360,0,0]),
  lift: F([0,0,0, 155,0,0, 180,1,OQ, 212,1,0, 228,0.7,LIN, 248,0,IO, 360,0,0]),
  skirt:F([0,0,0, 128,0,0, 145,-1,IO, 165,0,IO, 228,0,0, 233,2,OC, 244,1.5,LIN, 258,-0.7,IO, 274,0,IO, 360,0,0]),
  hat:  F([0,0,0, 130,0,0, 145,1,IO, 170,-1,OQ, 212,-1,0, 228,-1,0, 234,2,OC, 250,-1,IO, 268,0.5,IO, 288,0,IO, 360,0,0]),
  glow: F([0,1,0, 158,2,ST, 170,3,ST, 185,4,ST, 200,5,ST, 220,6,ST, 229,2,ST, 245,1,ST, 360,1,0]),
  rim:  F([0,6,0, 150,6,0, 175,14,LIN, 205,22,LIN, 220,48,ST, 228,48,0, 234,12,OQ, 260,6,IO, 360,6,0]),
  circ: F([0,0,0, 158,1,ST, 166,2,ST, 176,3,ST, 220,4,ST, 229,3,ST, 240,2,ST, 252,1,ST, 264,0,ST, 360,0,0])
};
const CIRC_R = F([0, 7, 11, 15, 16]);
const CIRC_L = F([0, 0.45, 0.75, 1.05, 1.6]);
const WAVE_T = [152, 164, 176, 187, 197];
const ARM_REACH = 10.6;
const SHX = [2, -2, 1, -1, 1, 0], SHY = [1, -1, 1, 0, 0, 0];   // cast shake (per 2 ticks)
const IHX = [0, 1, -1, 0], IHY = [1, -1, 1, 0];                // impact shake

// current pose (mutated in place, no per-frame allocation)
const P = { bx: 0, by: 0, hdx: 0, hdy: 0, eye: 0, mouth: 0, hx: 0, hy: 0, bhx: 0, bhy: 0, ffx: 0,
            tail: 0, tailF: 0, cape: 0, lift: 0, skirt: 0, hat: 0, glow: 1, rim: 0, circ: 0,
            dx: 0, dy: -1, gx: 0, gy: 0 };
let T = L - 1, TQ = 0;
let projSX = 0, projSY = 0;

function samplePose(tq) {
  const bxv = tr(K.bx, tq), byv = tr(K.by, tq);
  const breath = Math.sin(TAU * tq / 90 + 0.4) > 0.25 ? 1 : 0;       // stepped 1px breathing
  const ib = R(byv);
  P.bx = R(bxv);
  P.by = R(byv + tr(K.bw, tq) * breath);
  P.hdx = R(tr(K.hdx, tq)); P.hdy = R(tr(K.hdy, tq));
  P.eye = R(tr(K.eye, tq)); P.mouth = R(tr(K.mouth, tq));
  const jit = (tq >= 190 && tq < 212) ? ((tq / Q) & 1) : 0;           // strained tremble
  let hx = CX + P.bx + R(tr(K.fhx, tq)) + jit, hy = GY + ib + R(tr(K.fhy, tq));
  const shx = CX + P.bx - 2, shy = GY + P.by - 18, sdx = hx - shx, sdy = hy - shy, sd = Math.hypot(sdx, sdy);
  if (sd > ARM_REACH) { hx = shx + sdx * ARM_REACH / sd; hy = shy + sdy * ARM_REACH / sd; }  // keep grip reachable
  P.hx = R(hx); P.hy = R(hy);
  P.bhx = CX + P.bx + R(tr(K.bhx, tq));
  P.bhy = GY + ib + R(tr(K.bhy, tq));
  P.ffx = R(tr(K.ffx, tq));
  P.tail = tr(K.tail, tq); P.tailF = tr(K.tail, (tq - Q + L) % L);
  P.cape = tr(K.cape, tq); P.lift = tr(K.lift, tq); P.skirt = tr(K.skirt, tq);
  P.hat = tr(K.hat, tq) + Math.sin(TAU * tq / 120 + 1) * 0.7 + P.lift * Math.sin(TAU * tq / 20) * 0.9;
  let g = R(tr(K.glow, tq));
  if (g === 1 && (tq % 90) < 20) g = 2;                                 // idle gem pulse
  P.glow = g;
  P.rim = tr(K.rim, tq); P.circ = R(tr(K.circ, tq));
  const a = tr(K.ang, tq) * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  let best = 0, bd = -2;
  for (let i = 0; i < ND; i++) {
    const d = DIRS[i * 2] * ca + DIRS[i * 2 + 1] * sa;
    if (d > bd) { bd = d; best = i; }
  }
  P.dx = DIRS[best * 2]; P.dy = DIRS[best * 2 + 1];
  P.gx = R(P.hx + P.dx * 16); P.gy = R(P.hy + P.dy * 16);
}

// =====================================================================
//  CHARACTER PARTS
// =====================================================================
function commit(outlined, flag) {
  if (pbx1 < 0) return;
  const x0 = pbx0 - 1, x1 = pbx1 + 1, y0 = pby0 - 1, y1 = pby1 + 1;
  for (let y = y0; y <= y1; y++) {
    let i = y * W + x0;
    for (let x = x0; x <= x1; x++, i++) {
      const c = pb[i];
      if (c) { cb[i] = c; cf[i] = flag; }
      else if (outlined) {
        const n = pb[i - 1] || pb[i + 1] || pb[i - W] || pb[i + W];
        if (n) { cb[i] = OUTL[n]; cf[i] = 1; }
      }
    }
  }
  for (let y = pby0; y <= pby1; y++) pb.fill(0, y * W + pbx0, y * W + pbx1 + 1);
  pbx0 = W; pby0 = H; pbx1 = -1; pby1 = -1;
}
function lineP(x0, y0, x1, y1, c) {
  x0 = R(x0); y0 = R(y0); x1 = R(x1); y1 = R(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    pp(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function thickP(x0, y0, x1, y1, c) {      // 2x2 brush line
  x0 = R(x0 - 0.5); y0 = R(y0 - 0.5); x1 = R(x1 - 0.5); y1 = R(y1 - 0.5);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    pp(x0, y0, c); pp(x0 + 1, y0, c); pp(x0, y0 + 1, c); pp(x0 + 1, y0 + 1, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function blkP(x, y, c) {
  const x0 = R(x - 0.5), y0 = R(y - 0.5);
  pp(x0, y0, c); pp(x0 + 1, y0, c); pp(x0, y0 + 1, c); pp(x0 + 1, y0 + 1, c);
}
function shadeTop(base, hi) {             // light from above on the current part
  for (let y = pby0; y <= pby1; y++) for (let x = pbx0; x <= pbx1; x++) {
    const i = y * W + x;
    if (pb[i] === base && pb[i - W] === 0) pb[i] = hi;
  }
}

function drawCape(X, Y) {
  const lift = P.lift, sw = P.cape;
  const n = 11 - R(lift * 2);
  const lin = 1 + R(lift * 2 + Math.max(0, sw) * 0.35);
  for (let k = 0; k < n; k++) {
    const f = k / (n - 1);
    const wave = (Math.sin(TAU * TQ / 120 - f * 2 + 0.8) * 0.6 + lift * Math.sin(TAU * TQ / 20 - f * 3.5 + 2)) * f;
    const xl = R(X - 4 - k * 0.6 - sw * Math.pow(f, 1.5) - lift * f * 2.6 + wave), y = Y - 19 + k;
    for (let x = xl; x <= X + 1; x++) {
      let c = CS;
      if (k >= n - lin && x <= xl + 2) c = RD;                 // red lining flips up
      else if (x === xl + 1 && k > 0 && k < n - 2) c = CB;     // fold highlight
      pp(x, y, c);
    }
  }
}
function drawTail(rx, ry, len, bend, sway, lift, ph, far) {
  const cH = far ? HD : HB, cD = far ? HO : HD, cL = far ? HB : HL;
  const sq = 1 - lift * 0.18;
  for (let r = 0; r <= len; r++) {
    const t = r / len;
    const wave = (Math.sin(TAU * TQ / 120 - t * 2.4 + ph) * 0.7 + lift * Math.sin(TAU * TQ / 20 - t * 4.5 + ph) * 1.1) * t;
    const cx = rx - bend * Math.sin(t * 2.75) - sway * Math.pow(t, 1.4) - lift * t * 2.8 + wave;

  if (n === 8) acc = 0;
  renderScene(T);
  present();
  requestAnimationFrame(frame);
}

buildStatic();
for (let i = 0; i < L * 2; i++) step();   // pre-warm so the first view matches every later loop
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
})();
</script>
